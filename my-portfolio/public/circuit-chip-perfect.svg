<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 260" width="900" height="260" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <g filter="url(#glow)" stroke="#00e5ff" stroke-linecap="round" stroke-linejoin="round" fill="none">

    <!-- ══════════════════════════
         CHIP — square 160×160
         centred: x=370 y=50
    ══════════════════════════ -->
    <rect x="370" y="50" width="160" height="160" rx="2" stroke-width="5"/>

    <!-- top notch rectangle -->
    <rect x="418" y="36" width="64" height="18" rx="1" stroke-width="3.5"/>

    <!-- inner square frame -->
    <rect x="384" y="64" width="132" height="132" rx="1" stroke-width="2.5"/>

    <!-- ══ TOP PINS (left of notch and right of notch) ══ -->
    <g stroke-width="5" stroke-linecap="butt">
      <line x1="382" y1="50" x2="382" y2="36"/>
      <line x1="394" y1="50" x2="394" y2="36"/>
      <line x1="406" y1="50" x2="406" y2="36"/>
      <!-- notch gap 418–482 -->
      <line x1="484" y1="50" x2="484" y2="36"/>
      <line x1="496" y1="50" x2="496" y2="36"/>
      <line x1="508" y1="50" x2="508" y2="36"/>
      <line x1="520" y1="50" x2="520" y2="36"/>
    </g>

    <!-- ══ BOTTOM PINS — dense row ══ -->
    <g stroke-width="4" stroke-linecap="butt">
      <line x1="378" y1="210" x2="378" y2="224"/>
      <line x1="388" y1="210" x2="388" y2="224"/>
      <line x1="398" y1="210" x2="398" y2="224"/>
      <line x1="408" y1="210" x2="408" y2="224"/>
      <line x1="418" y1="210" x2="418" y2="224"/>
      <line x1="428" y1="210" x2="428" y2="224"/>
      <line x1="438" y1="210" x2="438" y2="224"/>
      <line x1="448" y1="210" x2="448" y2="224"/>
      <line x1="458" y1="210" x2="458" y2="224"/>
      <line x1="468" y1="210" x2="468" y2="224"/>
      <line x1="478" y1="210" x2="478" y2="224"/>
      <line x1="488" y1="210" x2="488" y2="224"/>
      <line x1="498" y1="210" x2="498" y2="224"/>
      <line x1="508" y1="210" x2="508" y2="224"/>
      <line x1="518" y1="210" x2="518" y2="224"/>
    </g>

    <!-- ══ LEFT SIDE PINS — short stubs ══ -->
    <g stroke-width="4" stroke-linecap="butt">
      <line x1="370" y1="68"  x2="356" y2="68"/>
      <line x1="370" y1="80"  x2="356" y2="80"/>
      <line x1="370" y1="92"  x2="356" y2="92"/>
      <line x1="370" y1="104" x2="356" y2="104"/>
      <line x1="370" y1="116" x2="356" y2="116"/>
      <line x1="370" y1="128" x2="356" y2="128"/>
      <line x1="370" y1="140" x2="356" y2="140"/>
      <line x1="370" y1="152" x2="356" y2="152"/>
      <line x1="370" y1="164" x2="356" y2="164"/>
      <line x1="370" y1="176" x2="356" y2="176"/>
      <line x1="370" y1="188" x2="356" y2="188"/>
      <line x1="370" y1="200" x2="356" y2="200"/>
    </g>

    <!-- ══ RIGHT SIDE PINS ══ -->
    <g stroke-width="4" stroke-linecap="butt">
      <line x1="530" y1="68"  x2="544" y2="68"/>
      <line x1="530" y1="80"  x2="544" y2="80"/>
      <line x1="530" y1="92"  x2="544" y2="92"/>
      <line x1="530" y1="104" x2="544" y2="104"/>
      <line x1="530" y1="116" x2="544" y2="116"/>
      <line x1="530" y1="128" x2="544" y2="128"/>
      <line x1="530" y1="140" x2="544" y2="140"/>
      <line x1="530" y1="152" x2="544" y2="152"/>
      <line x1="530" y1="164" x2="544" y2="164"/>
      <line x1="530" y1="176" x2="544" y2="176"/>
      <line x1="530" y1="188" x2="544" y2="188"/>
      <line x1="530" y1="200" x2="544" y2="200"/>
    </g>

    <!-- ══════════════════════════════════════════════
         LEFT TRACES — exactly 3 rows like reference

         TOP ROW: 3 lines fanning upward-left
         MID ROW: 3 lines going straight left
         BOT ROW: 3 lines fanning downward-left
    ══════════════════════════════════════════════ -->
    <g stroke-width="2">

      <!-- ── TOP-LEFT ROW (angles up) ── -->
      <!-- Line 1: longest, goes up high -->
      <polyline points="356,80 310,80 310,50 30,50"/>
      <circle cx="310" cy="80" r="4" fill="#00e5ff"/>
      <circle cx="30"  cy="50" r="5.5" fill="#00e5ff"/>

      <!-- Line 2: medium, steps up -->
      <polyline points="356,92 300,92 300,68 130,68"/>
      <circle cx="300" cy="92" r="4" fill="#00e5ff"/>
      <circle cx="130" cy="68" r="5.5" fill="#00e5ff"/>

      <!-- Line 2 branch stub going further left from step -->
      <polyline points="300,68 260,68 260,50 160,50"/>
      <circle cx="260" cy="68" r="3.5" fill="#00e5ff"/>
      <circle cx="160" cy="50" r="5"   fill="#00e5ff"/>

      <!-- Line 3: short, mild step up -->
      <polyline points="356,104 330,104 330,82 210,82"/>
      <circle cx="330" cy="104" r="4"   fill="#00e5ff"/>
      <circle cx="210" cy="82"  r="5.5" fill="#00e5ff"/>

      <!-- ── MID-LEFT ROW (horizontal) ── -->
      <!-- Line 4: long straight -->
      <polyline points="356,128 290,128 290,110 50,110"/>
      <circle cx="290" cy="128" r="4"   fill="#00e5ff"/>
      <circle cx="50"  cy="110" r="5.5" fill="#00e5ff"/>

      <!-- Line 4 branch -->
      <polyline points="290,110 250,110 250,96 150,96"/>
      <circle cx="250" cy="110" r="3.5" fill="#00e5ff"/>
      <circle cx="150" cy="96"  r="5"   fill="#00e5ff"/>

      <!-- Line 5: medium -->
      <polyline points="356,140 310,140 310,124 170,124"/>
      <circle cx="310" cy="140" r="4"   fill="#00e5ff"/>
      <circle cx="170" cy="124" r="5.5" fill="#00e5ff"/>

      <!-- Line 6: short -->
      <polyline points="356,152 330,152 330,138 230,138"/>
      <circle cx="330" cy="152" r="4"   fill="#00e5ff"/>
      <circle cx="230" cy="138" r="5.5" fill="#00e5ff"/>

      <!-- ── BOT-LEFT ROW (angles down) ── -->
      <!-- Line 7: longest, goes down far -->
      <polyline points="356,176 300,176 300,200 30,200"/>
      <circle cx="300" cy="176" r="4"   fill="#00e5ff"/>
      <circle cx="30"  cy="200" r="5.5" fill="#00e5ff"/>

      <!-- Line 7 branch stub -->
      <polyline points="300,200 260,200 260,220 140,220"/>
      <circle cx="260" cy="200" r="3.5" fill="#00e5ff"/>
      <circle cx="140" cy="220" r="5"   fill="#00e5ff"/>

      <!-- Line 8: medium step down -->
      <polyline points="356,188 310,188 310,210 160,210"/>
      <circle cx="310" cy="188" r="4"   fill="#00e5ff"/>
      <circle cx="160" cy="210" r="5.5" fill="#00e5ff"/>

      <!-- Line 9: short step down -->
      <polyline points="356,200 330,200 330,218 240,218"/>
      <circle cx="330" cy="200" r="4"   fill="#00e5ff"/>
      <circle cx="240" cy="218" r="5.5" fill="#00e5ff"/>

    </g>

    <!-- ══════════════════════════════════════════════
         RIGHT TRACES — mirror of left
    ══════════════════════════════════════════════ -->
    <g stroke-width="2">

      <!-- ── TOP-RIGHT ROW ── -->
      <polyline points="544,80 590,80 590,50 870,50"/>
      <circle cx="590" cy="80" r="4"   fill="#00e5ff"/>
      <circle cx="870" cy="50" r="5.5" fill="#00e5ff"/>

      <polyline points="544,92 600,92 600,68 770,68"/>
      <circle cx="600" cy="92" r="4"   fill="#00e5ff"/>
      <circle cx="770" cy="68" r="5.5" fill="#00e5ff"/>

      <polyline points="600,68 640,68 640,50 740,50"/>
      <circle cx="640" cy="68" r="3.5" fill="#00e5ff"/>
      <circle cx="740" cy="50" r="5"   fill="#00e5ff"/>

      <polyline points="544,104 570,104 570,82 690,82"/>
      <circle cx="570" cy="104" r="4"   fill="#00e5ff"/>
      <circle cx="690" cy="82"  r="5.5" fill="#00e5ff"/>

      <!-- ── MID-RIGHT ROW ── -->
      <polyline points="544,128 610,128 610,110 850,110"/>
      <circle cx="610" cy="128" r="4"   fill="#00e5ff"/>
      <circle cx="850" cy="110" r="5.5" fill="#00e5ff"/>

      <polyline points="610,110 650,110 650,96 750,96"/>
      <circle cx="650" cy="110" r="3.5" fill="#00e5ff"/>
      <circle cx="750" cy="96"  r="5"   fill="#00e5ff"/>

      <polyline points="544,140 590,140 590,124 730,124"/>
      <circle cx="590" cy="140" r="4"   fill="#00e5ff"/>
      <circle cx="730" cy="124" r="5.5" fill="#00e5ff"/>

      <polyline points="544,152 570,152 570,138 670,138"/>
      <circle cx="570" cy="152" r="4"   fill="#00e5ff"/>
      <circle cx="670" cy="138" r="5.5" fill="#00e5ff"/>

      <!-- ── BOT-RIGHT ROW ── -->
      <polyline points="544,176 600,176 600,200 870,200"/>
      <circle cx="600" cy="176" r="4"   fill="#00e5ff"/>
      <circle cx="870" cy="200" r="5.5" fill="#00e5ff"/>

      <polyline points="600,200 640,200 640,220 760,220"/>
      <circle cx="640" cy="200" r="3.5" fill="#00e5ff"/>
      <circle cx="760" cy="220" r="5"   fill="#00e5ff"/>

      <polyline points="544,188 590,188 590,210 740,210"/>
      <circle cx="590" cy="188" r="4"   fill="#00e5ff"/>
      <circle cx="740" cy="210" r="5.5" fill="#00e5ff"/>

      <polyline points="544,200 570,200 570,218 660,218"/>
      <circle cx="570" cy="200" r="4"   fill="#00e5ff"/>
      <circle cx="660" cy="218" r="5.5" fill="#00e5ff"/>

    </g>

  </g>
</svg>
