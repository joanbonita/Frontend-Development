<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 160 160" width="160" height="160" fill="none">
  <defs>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>
  <g filter="url(#glow)" stroke="#00e5ff" stroke-linecap="round" stroke-linejoin="round" fill="none">
    <!-- Outer square border -->
    <rect x="5" y="5" width="150" height="150" rx="2" stroke-width="4"/>
    <!-- Inner square frame -->
    <rect x="15" y="15" width="130" height="130" rx="1" stroke-width="2"/>
  </g>
</svg>
